id: de-heat-cn
author: "Tran Thi B"
course: DE
system: heat1d
law: "u_t = alpha u_xx, Dirichlet boundaries, Crank-Nicolson"
params: {alpha: 0.05, L: 1.0, nx: 101, scheme: cn}
initial: {modes: {"1": 1.0, "3": 0.3}}
t_span: [0.0, 0.5]
dt: 0.005
question:
  text: "Characteristic decay time of mode 1"
  quantity: decay_time_mode1
  answer: 2.0264
  unit: s
  tolerance: 0.001
checks: [stability, max_principle, {name: convergence_order, expected: 2.0}, {name: analytic_match, tol: 2.0e-3}, answer_matches]
license: CC-BY-4.0
consent_physeval: true
