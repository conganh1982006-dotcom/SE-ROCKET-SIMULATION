[project]
name = "wmlab"
version = "0.1.1"
description = "Physics-law world-model lab: scenario contract, reference simulators, verifiers"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "pyyaml>=6"]

[project.scripts]
wmlab = "wmlab.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
